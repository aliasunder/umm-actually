name: umm-actually
description: LLM PR review via OpenRouter — one consolidated review, inline findings
author: aliasunder
branding:
  icon: eye
  color: purple

inputs:
  github_token:
    description: Token used to fetch the diff and submit the review (a GitHub App installation token keeps the bot identity)
    required: true
  openrouter_api_key:
    description: OpenRouter API key
    required: true
  model:
    description: "OpenRouter model slug exactly as listed on openrouter.ai/models, e.g. anthropic/claude-sonnet-4-6"
    required: false
    default: anthropic/claude-sonnet-4-6
  fallback_model:
    description: Model to retry with if the primary model fails the structured-output ladder
    required: false
    default: ""
  request_timeout_seconds:
    description: Per-attempt timeout for a single model request, in seconds. A timed-out attempt aborts the HTTP call and advances the retry/fallback ladder instead of hanging the job. Empty = the 600 default, so workflows can wire an unset repo variable directly
    required: false
    default: "600"
  max_findings:
    description: Cap on posted findings, highest severity first. Empty = uncapped (all validated findings post)
    required: false
    default: ""
  severity_threshold:
    description: "Minimum severity to post: low | medium | high | critical"
    required: false
    default: low
  conventions_file:
    description: Repo-relative path to the conventions file included in the prompt (truncated at ~8000 tokens). When it also changed in the PR and this section carries the whole file, the changed-files copy is included diff-only so its text is not sent twice; when this section truncates, the changed-files copy stays full so the tail is not lost. When priority_docs reads the full file, the truncated conventions section is suppressed to avoid duplication
    required: false
    default: AGENTS.md
  phases:
    description: "Review phases to run. V1 supports: combined"
    required: false
    default: combined
  context_budget_tokens:
    description: Approximate token budget for prompt context (file contents + diff — conventions have a separate cap)
    required: false
    default: "80000"
  trace_related_files:
    description: Include related files in the prompt — import-tracing for caller regressions, and doc-mention scanning for staleness detection
    required: false
    default: "true"
  priority_docs:
    description: Comma-separated repo-relative paths always included in review context. A doc whose full text is already in context — as a full-content changed file, a related file, or the conventions file (when that section carries the whole file) — is not read again; a diff-only changed file is still read here (empty = disabled)
    required: false
    default: "README.md"
  max_scan_files:
    description: Maximum files to walk during workspace scan for related file and doc detection
    required: false
    default: "5000"
  max_scan_bytes:
    description: Maximum byte size of a single file to include in the workspace scan
    required: false
    default: "262144"
  max_related_files:
    description: Maximum import-traced related files to include in review context
    required: false
    default: "8"
  max_related_docs:
    description: Maximum mention-matched documentation files to include in review context (excludes priority docs)
    required: false
    default: "4"
  cost_summary:
    description: Write a per-run cost report (model, prompt/completion tokens, USD) to the workflow step summary
    required: false
    default: "true"
  pr_number:
    description: PR number override — required only when the triggering event does not identify a PR directly
    required: false
    default: ""

outputs:
  findings_count:
    description: Number of new findings successfully posted this run (after threshold, cap, and cross-run dedup; findings whose post failed are excluded and re-report on the next run)
  review_url:
    description: URL of the submitted review; empty when no review was posted
  model_used:
    description: Model that produced the accepted response
  skipped_reason:
    description: Non-empty when the review was skipped (e.g. diff too large)

runs:
  using: docker
  image: docker://ghcr.io/aliasunder/umm-actually@sha256:76c689016e27581434d220a5b0fe6d0ba9eeea54a35affb34ecb1b99117d16e5
