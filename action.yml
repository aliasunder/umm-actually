name: umm-actually
description: LLM PR review via OpenRouter — one consolidated review, inline findings
author: aliasunder
branding:
  icon: eye
  color: purple

inputs:
  github_token:
    description: Token used to fetch the diff and submit the review (a GitHub App installation token keeps the bot identity)
    required: true
  openrouter_api_key:
    description: OpenRouter API key
    required: true
  model:
    description: "OpenRouter model slug (no provider prefix), e.g. anthropic/claude-sonnet-4-6"
    required: false
    default: anthropic/claude-sonnet-4-6
  fallback_model:
    description: Model to retry with if the primary model fails the structured-output ladder
    required: false
    default: ""
  max_findings:
    description: Cap on posted findings, highest severity first. Empty = uncapped (all validated findings post)
    required: false
    default: ""
  severity_threshold:
    description: "Minimum severity to post: low | medium | high | critical"
    required: false
    default: low
  conventions_file:
    description: Repo-relative path to the conventions file included in the prompt
    required: false
    default: AGENTS.md
  phases:
    description: "Review phases to run. V1 supports: combined"
    required: false
    default: combined
  context_budget_tokens:
    description: Approximate token budget for prompt context (conventions + file contents + diff)
    required: false
    default: "80000"
  trace_related_files:
    description: Include files that reference changed files in the prompt so the model can trace regressions into callers
    required: false
    default: "true"
  pr_number:
    description: PR number override — required only when the triggering event does not identify a PR directly
    required: false
    default: ""

outputs:
  findings_count:
    description: Number of findings posted (after threshold and cap)
  review_url:
    description: URL of the submitted review; empty when no review was posted
  model_used:
    description: Model that produced the accepted response
  skipped_reason:
    description: Non-empty when the review was skipped (e.g. diff too large)

runs:
  using: docker
  image: Dockerfile
