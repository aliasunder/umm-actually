name: umm-actually
description: LLM PR review via OpenRouter — one consolidated review, inline findings
author: aliasunder
branding:
  icon: eye
  color: purple

inputs:
  github_token:
    description: Token used to fetch the diff and submit the review (a GitHub App installation token keeps the bot identity)
    required: true
  openrouter_api_key:
    description: OpenRouter API key
    required: true
  model:
    description: "OpenRouter model slug exactly as listed on openrouter.ai/models, e.g. anthropic/claude-sonnet-4-6"
    required: false
    default: anthropic/claude-sonnet-4-6
  fallback_model:
    description: Model to retry with if the primary model fails the structured-output ladder
    required: false
    default: ""
  request_timeout_seconds:
    description: Per-attempt deadline for a single model request, in seconds. When it elapses the attempt is recorded as `timeout` and the retry/fallback ladder advances whether or not the provider connection closes; the HTTP call is aborted best-effort. Empty = the 900 default, so workflows can wire an unset repo variable directly
    required: false
    default: "900"
  max_findings:
    description: Cap on posted findings, highest severity first. Empty = uncapped (all validated findings post)
    required: false
    default: ""
  severity_threshold:
    description: "Minimum severity to post: low | medium | high | critical"
    required: false
    default: low
  conventions_file:
    description: Repo-relative path to the conventions file included in the prompt (truncated at ~8000 tokens)
    required: false
    default: AGENTS.md
  phases:
    description: "How the review dimensions are dispatched: combined (one model call carrying every dimension) | parallel (three focused calls at once — each reads deeper than the single call; wall clock is the slowest of the three and prompt tokens roughly triple) | sequential (the same three calls in order, each seeing the earlier findings). Empty = combined, so workflows can wire an unset repo variable directly"
    required: false
    default: combined
  context_budget_tokens:
    description: Approximate token budget for prompt context (file contents + diff — conventions have a separate cap)
    required: false
    default: "300000"
  trace_related_files:
    description: Include related files in the prompt — import-tracing for caller regressions, and doc-mention scanning for staleness detection
    required: false
    default: "true"
  priority_docs:
    description: Comma-separated repo-relative paths always included in review context. Docs already present in full from other context channels are not re-read (empty = disabled)
    required: false
    default: "README.md"
  max_scan_files:
    description: Maximum files to walk during workspace scan for related file and doc detection
    required: false
    default: "5000"
  max_scan_bytes:
    description: Maximum byte size of a single file to include in the workspace scan
    required: false
    default: "262144"
  max_related_files:
    description: Maximum import-traced related files to include in review context
    required: false
    default: "8"
  max_related_docs:
    description: Maximum mention-matched documentation files to include in review context (excludes priority docs)
    required: false
    default: "4"
  exclude_paths:
    description: >-
      Comma-separated folder prefixes excluded from the workspace scan.
      Files under these paths are invisible to import-tracing and
      doc-mention matching (they cannot become related files or
      mention-matched docs). Changed files in the PR diff and
      priority_docs are never excluded. Example: evals, fixtures,
      __snapshots__
    required: false
    default: ""
  diff_exclude_paths:
    description: >-
      Comma-separated folder prefixes or globs removed from the review diff
      before the token budget check — excluded files are listed by name in
      the review output but their content is not reviewed (excluded is not
      vetted). Supplied patterns EXTEND a built-in default list of
      generated artifacts (ecosystem lockfiles, *.min.js, *.min.css,
      *.map — the classes GitHub's linguist auto-collapses); a leading
      "none" drops the defaults, so "none" alone disables the built-in
      list (linguist-generated exclusions are governed separately by
      respect_linguist_generated) and "none, evals/**" replaces the list
      outright. Empty = the default
      list (unlike exclude_paths, where empty means no exclusions), so
      workflows can wire an unset repo variable directly. Patterns with
      more than 2 "*" in one path segment are rejected ("**" segments are
      exempt) — glob matching backtracks exponentially on such shapes.
      Example: none, **/__snapshots__/**
    required: false
    default: ""
  respect_linguist_generated:
    description: >-
      Also exclude changed files the repo's root .gitattributes marks
      linguist-generated=true (nested .gitattributes files are not read).
      Negated entries (-linguist-generated) keep a file reviewable even
      when the default diff_exclude_paths list matches it; explicitly
      supplied diff_exclude_paths patterns always win. Rules are read from
      the PR head, so a PR changing .gitattributes reviews under its own
      rules — exclusions are always named in the review output
    required: false
    default: "true"
  cost_summary:
    description: Write a per-run cost report (model, prompt/completion tokens, USD) to the workflow step summary
    required: false
    default: "true"
  pr_number:
    description: PR number override — required only when the triggering event does not identify a PR directly
    required: false
    default: ""

outputs:
  findings_count:
    description: Number of new findings successfully posted this run (after threshold, cap, and cross-run dedup; findings whose post failed are excluded and re-report on the next run)
  review_url:
    description: URL of the submitted review; empty when no review was posted
  model_used:
    description: Model(s) that produced the accepted responses, comma-separated when phases were routed to different models
  skipped_reason:
    description: Non-empty when the review was skipped (e.g. diff too large)

runs:
  using: docker
  image: Dockerfile
