# Temporary workflow for the Agent SDK migration. It captures raw Responses
# API payloads for the client's fixtures and is removed before the PR merges.
name: Probe Responses

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # The probe sends real requests with the repo's key, so a single run is
    # enough to capture every payload
    timeout-minutes: 10
    # Only the owner's same-repo PRs run secrets-bearing jobs
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Capture Responses payloads
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: bun .github/scripts/probe-responses.ts
