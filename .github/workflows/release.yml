name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Queue, never cancel: the release job's own tag force-moves retrigger this
# workflow (App-token pushes are not suppressed the way GITHUB_TOKEN pushes
# are), and a cancelling retrigger could kill the real run between its tag
# push and its GitHub Release step. Retriggered runs skip via the gate below.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Idempotency gate: the digest-flip commit is the marker that a release
  # already completed for this tag. First run on a tag sees `image:
  # Dockerfile` and proceeds; the runs retriggered by this workflow's own
  # semver and major-tag force-pushes see the digest pin and skip — without
  # this, each retrigger would rebuild and overwrite the just-published
  # GHCR artifacts with different bits.
  gate:
    runs-on: ubuntu-latest
    outputs:
      already-pinned: ${{ steps.check.outputs.already-pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the tag already points at a digest-pinned commit
        id: check
        run: |
          if grep -qF "image: docker://" action.yml; then
            echo "already-pinned=true" >> "$GITHUB_OUTPUT"
            echo "Release already completed for this tag — skipping."
          else
            echo "already-pinned=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: gate
    if: needs.gate.outputs.already-pinned == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    # generate-notes.sh reads merged PRs (labels/body) for breaking-change
    # detection with GITHUB_TOKEN, so the job needs pull-requests: read.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Flip action.yml image to digest-pinned GHCR reference
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sed -i "s|image: Dockerfile|image: docker://${IMAGE}@${DIGEST}|" action.yml
          git config user.name "umm-actually[bot]"
          git config user.email "umm-actually[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "chore(release): pin image to ${DIGEST}"

      - name: Force-move semver tag to the digest-flipped commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Force-move floating major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

      # The pin commit lives off main, so the previous release tag is never an
      # ancestor of this one and git cannot discover it — resolve it from the
      # release list instead. A first-ever release yields an empty list (exit 0)
      # and the script notes the whole history; an API failure exits non-zero
      # and fails the step rather than silently producing wrong notes.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          bash .github/scripts/generate-notes.sh "$TAG" ${PREVIOUS_TAG:+"$PREVIOUS_TAG"} > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      # The checkout is detached at the pin commit; CHANGELOG.md lives on main.
      - name: Update CHANGELOG.md on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout main
          bash .github/scripts/update-changelog.sh "${TAG#v}" "$RUNNER_TEMP/release-notes.md"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for $TAG"
          git push origin main
