name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Comments without the trigger phrase still create a (guard-skipped) run —
# isolate them in a per-run group so they can't cancel an in-flight review.
# Every reply a review session posts on the PR would otherwise kill the very
# review run it's responding to.
concurrency:
  group: self-review-${{ github.event.pull_request.number || github.event.issue.number }}${{ (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '@umm review')) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@umm review')
      )
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.UMM_CLIENT_ID }}
          private-key: ${{ secrets.UMM_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          # Optional — enables the branded check run (App avatar in the checks list)
          permission-checks: write

      - uses: ./
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          openrouter_api_key: ${{ secrets.OPENROUTER_KEY }}
          model: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-4-6' }}
          # Unset passes "" — the action treats empty as its 600 default
          request_timeout_seconds: ${{ vars.UMM_REQUEST_TIMEOUT_SECONDS }}
